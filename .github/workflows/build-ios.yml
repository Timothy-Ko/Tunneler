name: Build iOS app (unsigned IPA for AltStore)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript dependencies
        run: npm install

      - name: Align package versions with the installed Expo SDK
        run: npx expo install --fix

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios

      - name: Build the app without code signing
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TrenchMap.ipa Payload
          ls -lh TrenchMap.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TrenchMap-ipa
          path: TrenchMap.ipa
          retention-days: 30
